name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check client scripts
        run: |
          node --check Jellyfin.Plugin.JellyStream/Web/client.js
          for f in extras/theme/*.js; do node --check "$f"; done

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyStream/Jellyfin.Plugin.JellyStream.csproj -c Release -o out

      - name: Package
        id: pkg
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.JellyStream/Jellyfin.Plugin.JellyStream.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/pkg
          cp out/Jellyfin.Plugin.JellyStream.dll artifacts/pkg/
          (cd artifacts/pkg && zip -q ../jellystream_${VERSION}.zip Jellyfin.Plugin.JellyStream.dll)
          python3 .github/manifest.py "$VERSION" "artifacts/jellystream_${VERSION}.zip" "${{ github.repository }}" > artifacts/manifest.json
          cat artifacts/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: jellystream
          path: |
            artifacts/*.zip
            artifacts/manifest.json

      # every new version on main becomes a release, with the plugin catalog manifest attached
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released"
          else
            gh release create "v$VERSION" artifacts/jellystream_${VERSION}.zip artifacts/manifest.json \
              --title "JellyStream $VERSION" --notes-file <(python3 .github/manifest.py --notes)
          fi
