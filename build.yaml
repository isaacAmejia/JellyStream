version: "1.17.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Netflix TV movement: the selected row settles at the same height and the selected title stays at
  the left edge while the row slides (works with JellyNav). The title only widens, nothing scales.
  Fixed Top 10 cards collapsing after being selected. Netflix colour fills the whole page, theme
  frames removed, and phone row sizes matched to the Netflix app.
