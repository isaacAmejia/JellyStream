version: "1.19.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Every service's banner now rotates through its top titles (dots, slow drift, swipe on phones;
  pauses while you're on it). Disney+ page redone after the Disney+ apps: full-width banner under
  Disney's top pill tabs on TV, rounded poster card on phones, teal corner Top 10 numbers, cards
  that open wide with rating, year and genres, New Episode / Recently Added tags, and a wide
  Continue Watching row with progress bars.
