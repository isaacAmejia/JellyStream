name: "JellyStream"
guid: "f7d3a9e1-4c2b-4e8a-9b1f-6a2c8d5e3f70"
version: "1.24.1.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Service homes follow the Home Screen Sections plugin when it's installed: its rows, in its order, with its titles,
  limited to each service and styled like it (its Top 10, My Media and Seerr/Live TV rows are left out; JellyStream's
  themed Top 10s stay). Without it, Jellyfin's own home sections are used. More light in the Jellyfin intro.
