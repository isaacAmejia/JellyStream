version: "1.20.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Prime Video page redone after the Prime Video apps. On TV the banner shows whatever title is
  selected (art, "#1" line, genre / length / year / rating, description, Included with Prime), with
  the selected row held just under it; with a mouse, hovering a card does the same. Prime's centered
  tab bar, wide titled cards with white corner labels, light Top 10 numerals, and on phones dark
  chips, portrait posters and outlined Top 10 numbers.
