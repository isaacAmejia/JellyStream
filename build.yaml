version: "1.21.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Jellyfin is now the main "service": the first pill is Jellyfin (back to the Jellyfin home, with its
  own intro video or animation), and Jellyfin's Home tab opens whichever service you picked last on
  that device, also after leaving and coming back or reloading. Intros only play when you switch to a
  different service. Upload Jellyfin's intro in settings under Intros.
