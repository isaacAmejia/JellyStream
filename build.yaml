version: "1.18.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Netflix's Top 10 now comes from Netflix's own published weekly Top 10 for your region, each title
  checked against TMDB to confirm it streams on Netflix there. Falls back to trending when the list
  can't be loaded (setting under Service pages). Other services keep the trending-based Top 10.
