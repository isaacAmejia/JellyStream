name: "JellyStream"
guid: "f7d3a9e1-4c2b-4e8a-9b1f-6a2c8d5e3f70"
version: "1.25.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Service pages use JellyStream's own rows again, now chosen in the dashboard: JellyStream settings has a "Service
  page rows" list where you turn each row on or off and set the order (the same for every service; Jellyfin's home
  isn't changed). Rows: Continue Watching (progress bars), Next Up, Top 10 Shows, Top 10 Movies, New on the service,
  My List, Because You Watched, Watch Again, genre rows, Popular to Request (movies, shows), All Shows, All Movies
  and the Browse panel.
