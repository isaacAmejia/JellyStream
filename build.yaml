name: "JellyStream"
guid: "f7d3a9e1-4c2b-4e8a-9b1f-6a2c8d5e3f70"
version: "1.10.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Service pages no longer change Jellyfin's route, which on the classic layout left a stale copy of
  the home screen behind when opening a title. Each service's Top 10 now follows that service's own
  layout. Intros always play (about two seconds). Posters are cached by the browser and load faster.
