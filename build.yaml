targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Netflix page redesigned after the Netflix TV and phone apps: header tabs styled as Netflix's
  navigation, poster rows whose selected title opens wide with its details below, outlined Top 10,
  Recently Added / New Episode / Top 10 badges, and the tall poster billboard on phones.
