name: "JellyStream"
guid: "5c4e9982-450c-443e-a4a4-297d618258e5"
version: "1.5.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Service pages now open with a billboard of that service's #1 title and follow its app's
  layout: landscape or poster cards, captions, buttons and type per service (Netflix, Disney+,
  HBO Max, Prime Video, Hulu, Apple TV+, Paramount+, Peacock). Opening a title falls back to a
  plain link if Jellyfin's router doesn't respond.
