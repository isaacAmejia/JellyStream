version: "1.18.1.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  New "Top 10 status" section in the plugin settings: for every service's movie and show Top 10, where
  it comes from right now (Netflix's official list, trending, or popular), how many titles that source
  has, when it last updated successfully, and the last error if one failed.
