framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Library with remotes: opens with the selection on the first title, filters keep the selection where you pressed,
  Back closes the library and returns you to the tile you came from, and the Pi gets crisp, lighter scrolling. The
  Jellyfin intro sound is now all low end (no high-pitched parts).
