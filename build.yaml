version: "1.22.8.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Jellyfin intro: the name now reveals with a clean light wipe in a new typeface, the score is a deep theatre-style
  swell (a cloud of voices converging on one huge chord over sub-bass), and the logo and name now fly into the
  Jellyfin pill on the home screen and become it as the black lifts.
