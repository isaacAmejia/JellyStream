version: "1.22.2.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Pages that stay open through a plugin update (phone apps kept in the background, TVs) now load the
  new version by themselves the next time you're on the home screen. Also: Jellyfin's intro videos
  show in settings once uploaded, and the Jellyfin pill uses the real Jellyfin logo.
