version: "1.22.6.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  A calmer, more refined Jellyfin intro: the screen frosts over, a small glass bead touches down with one fine
  ripple, the logo settles out of it as lit glass, "Jellyfin" fades up, and the frost clears from the middle onto
  the home screen. Softer sound effects to match.
