name: "JellyStream"
guid: "f7d3a9e1-4c2b-4e8a-9b1f-6a2c8d5e3f70"
version: "1.9.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Opening a title from a service page goes straight to its details page.
  Each service now has its own background, row sizes and Top 10 style.
  No more duplicate or blank Top 10 entries; intros are capped at about two seconds.
  Cleaner services row and switcher with no small app icons.
