version: "1.13.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Wide cards show each title's logo (or name); the billboard uses the title logo. Home/Shows/Movies
  tabs removed, More Info icon fixed. Top 10 rows are spread apart. Service tiles match the home
  screen's card size and show the service logo again. More per-service row styling.
