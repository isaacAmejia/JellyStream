name: "JellyStream"
guid: "5c4e9982-450c-443e-a4a4-297d618258e5"
version: "1.2.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  Top 10s now follow what's trending this week (or today) on each service. Service pages take
  on the service's look (colors, background, glows, focus ring), use the glass Top 10 numbers,
  header and expand built in, open with a smooth logo morph, and no longer leave a gap where
  Media Bar sits.
