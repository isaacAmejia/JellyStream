version: "1.22.9.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Browse your library by streaming service, with a Top 10 for each."
description: >
  Adds a row of streaming services to the home screen. Each one opens its own
  home screen with only what is currently on that service: Top 10 movies and
  shows, recently added, and your library grouped by genre. Titles you don't
  have can be requested through Seerr.
category: "General"
owner: "isaacAmejia"
artifacts:
- "Jellyfin.Plugin.JellyStream.dll"
changelog: >
  A grander, slower Jellyfin intro: light chatter wanders and pulls into the logo as the voices converge, a flare and
  slow turning beams of light when it lands, a bigger logo, and a bigger score (32 voices spread across the room, a
  rumble rolling into the hit, a crash of light and a brass swell). Everything runs slower, and slower again on a Pi.
